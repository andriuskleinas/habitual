name: Supabase keep-alive

# Supabase pauses Free Plan projects after ~7 days with too little database
# API traffic. This pings a lightweight read-only endpoint daily so the
# project is never a candidate for pausing. Runs well inside the 7-day
# window on purpose, so a missed/delayed run or two is harmless.
#
# The URL and key below are the NEXT_PUBLIC_* Supabase values already
# shipped to every browser that loads the app (see README's Environment
# table) — safe to commit, access is governed by Row Level Security.

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch: {} # allows a manual "Run workflow" for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/challenges?select=id&limit=1"
        env:
          SUPABASE_URL: https://uxsaaxjqwzcekwbfmzqe.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_iuCUhNJ3Lc8IswdatYam6g_k7Fk3ave
