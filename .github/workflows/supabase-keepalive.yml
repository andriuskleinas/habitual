name: Supabase keep-alive

# Supabase pauses Free Plan projects with too little database activity over
# 7 days. Three layers keep this one up:
#
# 1. A real write. The first version did an anonymous REST read every 5 days,
#    and the project still paused twice, each time within 5 days of a
#    successful ping (Sep 6 → Sep 11 and Sep 26 → Oct 1, 2026). So the ping
#    now calls public.keepalive(), which updates a one-row heartbeat table
#    (supabase/migrations/20261004202625_keepalive.sql).
# 2. Two schedulers. GitHub runs scheduled jobs on a best-effort basis (late,
#    or dropped under load) and disables them in a public repo after 60 days
#    without commits, so this runs twice a day at off-peak minutes, and Vercel
#    Cron pings /api/keepalive daily on its own (vercel.json).
# 3. Self-healing. If the ping fails and the project turns out to be paused,
#    this job restores it through the Management API, as long as the
#    SUPABASE_ACCESS_TOKEN secret is set. It still fails the run either way,
#    so GitHub emails you.
#
# The URL and key are the NEXT_PUBLIC_* values every browser that loads the
# app already gets: safe to commit, access is governed by Row Level Security.

on:
  schedule:
    - cron: "17 6,18 * * *" # 06:17 and 18:17 UTC
  workflow_dispatch: {} # "Run workflow" button for a manual check

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: uxsaaxjqwzcekwbfmzqe
      SUPABASE_URL: https://uxsaaxjqwzcekwbfmzqe.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_iuCUhNJ3Lc8IswdatYam6g_k7Fk3ave
    steps:
      # Retry for ~5 minutes so one flaky request doesn't fail the run.
      - name: Write a heartbeat
        id: ping
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 60 --retry-all-errors \
            -X POST \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_source":"github"}' \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive"

      - name: Restore the project if it was paused
        if: steps.ping.outcome == 'failure'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The ping failed and there's no SUPABASE_ACCESS_TOKEN secret, so the project can't be restored automatically. Restore it from the Supabase dashboard."
            exit 1
          fi

          api="https://api.supabase.com/v1/projects/${PROJECT_REF}"
          status=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$api" | jq -r .status)
          echo "Project status: ${status}"

          if [ "$status" = "INACTIVE" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "${api}/restore"
            echo "::warning::The project was paused. Restore requested; it takes a few minutes to come back."
          else
            echo "::error::The ping failed but the project isn't paused (status ${status}). Check the Supabase dashboard."
          fi
          exit 1
