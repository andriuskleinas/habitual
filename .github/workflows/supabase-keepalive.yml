name: Supabase keep-alive

# Supabase pauses Free Plan projects after ~7 days with too little database
# API traffic. This pings a lightweight read-only endpoint every 5 days so
# the project is never a candidate for pausing, with 2 days of slack for a
# missed/delayed run before it'd matter.
#
# Cron's day-of-month field can't express "every 5 days" across month
# boundaries exactly (it fires on days 1, 6, 11, 16, 21, 26, 31) — the gap
# from the 26th/31st into next month is occasionally 1-6 days instead of
# 5, but it's always comfortably under the 7-day pause window.
#
# The URL and key below are the NEXT_PUBLIC_* Supabase values already
# shipped to every browser that loads the app (see README's Environment
# table) — safe to commit, access is governed by Row Level Security.

on:
  schedule:
    - cron: "0 12 */5 * *" # every 5 days at 12:00 UTC
  workflow_dispatch: {} # allows a manual "Run workflow" for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/challenges?select=id&limit=1"
        env:
          SUPABASE_URL: https://uxsaaxjqwzcekwbfmzqe.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_iuCUhNJ3Lc8IswdatYam6g_k7Fk3ave
